<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetria - Atelier de Poesia e Diagramação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Sortable.js for Drag and Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment: {
                            50: '#fdfbf7',
                            100: '#f7f3e9',
                            200: '#efe6d5',
                            300: '#e2d3b7',
                            800: '#3a3125',
                            900: '#241e17'
                        },
                        ink: {
                            500: '#4a5568',
                            800: '#1a202c',
                            900: '#0f172a'
                        }
                    },
                    fontFamily: {
                        garamond: ['"EB Garamond"', 'serif'],
                        lora: ['Lora', 'serif'],
                        cinzel: ['Cinzel', 'serif'],
                        merriweather: ['Merriweather', 'serif'],
                        cursive: ['"Dancing Script"', 'cursive'],
                        mono: ['"Fira Code"', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Page Simulation Aspect Ratios */
        .page-ratio-a5 {
            aspect-ratio: 148 / 210;
        }
        .page-ratio-trade {
            aspect-ratio: 6 / 9;
        }
        .page-ratio-mobile {
            aspect-ratio: 9 / 16;
        }

        /* Drop Cap Styling */
        .drop-cap::first-letter {
            font-size: 3.2em;
            float: left;
            line-height: 0.8;
            padding-right: 0.15em;
            padding-top: 0.05em;
            font-weight: bold;
            color: inherit;
        }

        /* Print Media Styles for clean PDF export */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-break-after {
                page-break-after: always;
                break-after: page;
            }
            .book-page-print {
                width: 100% !important;
                height: 100vh !important;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 2cm !important;
                page-break-after: always;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }
        }
    </style>
</head>
<body class="bg-parchment-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans h-full flex flex-col transition-colors duration-200">

    <!-- Navigation Header -->
    <header class="no-print bg-parchment-50 dark:bg-slate-800 border-b border-parchment-300 dark:border-slate-700 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-amber-800 dark:bg-amber-600 text-parchment-50 flex items-center justify-center font-cinzel font-bold text-xl shadow-inner">
                P
            </div>
            <div>
                <h1 class="font-cinzel font-bold text-lg leading-none tracking-wide text-amber-950 dark:text-amber-200">Poetria</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Atelier de Escrita & Diagramação</p>
            </div>
        </div>

        <!-- Book Title Input -->
        <div class="flex-1 max-w-md mx-4 hidden sm:block">
            <input type="text" id="book-title-input" value="Meu Livro de Poesias" 
                class="w-full text-center font-garamond font-semibold text-lg bg-transparent border-b border-dashed border-amber-800/30 dark:border-slate-600 focus:border-amber-700 dark:focus:border-amber-400 focus:outline-none px-2 py-0.5 text-amber-950 dark:text-slate-100"
                placeholder="Título do Livro..." title="Clique para editar o título do livro">
        </div>

        <!-- View Mode Switches & Actions -->
        <div class="flex items-center space-x-2">
            <!-- Tabs / View Modes -->
            <div class="bg-parchment-200 dark:bg-slate-700 p-1 rounded-lg flex text-xs font-medium">
                <button id="tab-editor-btn" onclick="switchTab('editor')" class="px-3 py-1.5 rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-amber-900 dark:text-slate-100">
                    <i class="fa-solid fa-pen-nib mr-1.5"></i>Escrita
                </button>
                <button id="tab-preview-btn" onclick="switchTab('preview')" class="px-3 py-1.5 rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900">
                    <i class="fa-solid fa-book-open mr-1.5"></i>Diagramação
                </button>
                <button id="tab-split-btn" onclick="switchTab('split')" class="px-3 py-1.5 rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 hidden md:block">
                    <i class="fa-solid fa-columns mr-1.5"></i>Divisões
                </button>
            </div>

            <div class="h-5 w-px bg-slate-300 dark:bg-slate-700 mx-1"></div>

            <!-- Dark/Light Theme Toggle -->
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-parchment-200 dark:hover:bg-slate-700" title="Alternar tema escuro/claro">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <!-- Export / Save Menu -->
            <div class="relative group">
                <button class="bg-amber-800 hover:bg-amber-900 dark:bg-amber-700 dark:hover:bg-amber-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center transition shadow-sm">
                    <i class="fa-solid fa-download mr-1.5"></i>Exportar <i class="fa-solid fa-chevron-down ml-1.5 text-[10px]"></i>
                </button>
                <div class="absolute right-0 mt-1 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-xl py-1 hidden group-hover:block z-50">
                    <button onclick="exportToPrint()" class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-700 flex items-center">
                        <i class="fa-solid fa-file-pdf mr-2 text-red-500"></i>Imprimir / PDF
                    </button>
                    <button onclick="exportProjectJSON()" class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-700 flex items-center">
                        <i class="fa-solid fa-file-code mr-2 text-blue-500"></i>Projeto Backup (.json)
                    </button>
                    <button onclick="exportTextEPUB()" class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-700 flex items-center">
                        <i class="fa-solid fa-file-lines mr-2 text-emerald-500"></i>Texto Formatado (ePub)
                    </button>
                    <hr class="my-1 border-slate-100 dark:border-slate-700">
                    <label class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-700 flex items-center cursor-pointer">
                        <i class="fa-solid fa-upload mr-2 text-purple-500"></i>Importar Projeto
                        <input type="file" id="import-json-input" onchange="importProjectJSON(event)" accept=".json" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Workspace -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- SIDEBAR: Poem List & Organization -->
        <aside id="sidebar" class="no-print w-72 bg-parchment-50 dark:bg-slate-800 border-r border-parchment-300 dark:border-slate-700 flex flex-col shrink-0 transition-all duration-300 z-10">
            <div class="p-3 border-b border-parchment-200 dark:border-slate-700 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Poemas / Capítulos</span>
                <button onclick="addNewPoem()" class="p-1.5 rounded-md bg-amber-800 text-white hover:bg-amber-900 dark:bg-amber-700 text-xs flex items-center shadow-sm" title="Novo Poema">
                    <i class="fa-solid fa-plus mr-1"></i>Novo
                </button>
            </div>

            <!-- Poem List (Sortable) -->
            <div id="poem-list-container" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Dynamic poem items generated by JS -->
            </div>

            <!-- Sidebar Footer Stats -->
            <div class="p-3 bg-parchment-100 dark:bg-slate-850 border-t border-parchment-300 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 flex justify-between items-center">
                <span id="total-poems-count">0 poemas</span>
                <span id="total-words-count">0 palavras</span>
            </div>
        </aside>

        <!-- CENTER AREA: Editor & Live Preview Split Screen -->
        <main class="flex-1 flex overflow-hidden bg-parchment-200/50 dark:bg-slate-950">

            <!-- EDITOR PANEL -->
            <section id="editor-panel" class="flex-1 flex flex-col h-full bg-parchment-50 dark:bg-slate-900 border-r border-parchment-300 dark:border-slate-800 overflow-hidden">
                
                <!-- Toolbar for Selected Poem -->
                <div class="no-print p-2 border-b border-parchment-200 dark:border-slate-800 bg-parchment-100/70 dark:bg-slate-850 flex flex-wrap items-center gap-2 text-xs">
                    
                    <!-- Font Selector -->
                    <div class="flex items-center space-x-1 bg-white dark:bg-slate-800 p-1 rounded border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-font text-slate-400 px-1"></i>
                        <select id="poem-font-select" onchange="updateCurrentPoemStyle()" class="bg-transparent focus:outline-none text-slate-700 dark:text-slate-200">
                            <option value="font-garamond">EB Garamond (Serif)</option>
                            <option value="font-lora">Lora (Serif)</option>
                            <option value="font-cinzel">Cinzel (Clássica)</option>
                            <option value="font-cursive">Dancing Script (Manuscrita)</option>
                            <option value="font-sans">Inter (Sans)</option>
                            <option value="font-mono">Fira Code (Monospace)</option>
                        </select>
                    </div>

                    <!-- Alignment Selector -->
                    <div class="flex items-center bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 p-0.5">
                        <button onclick="setPoemAlign('text-left')" id="btn-align-left" class="p-1 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Alinhar à esquerda">
                            <i class="fa-solid fa-align-left"></i>
                        </button>
                        <button onclick="setPoemAlign('text-center')" id="btn-align-center" class="p-1 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Centralizar">
                            <i class="fa-solid fa-align-center"></i>
                        </button>
                        <button onclick="setPoemAlign('text-right')" id="btn-align-right" class="p-1 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Alinhar à direita">
                            <i class="fa-solid fa-align-right"></i>
                        </button>
                    </div>

                    <!-- Extra Formatting Options -->
                    <div class="flex items-center space-x-1 bg-white dark:bg-slate-800 p-1 rounded border border-slate-200 dark:border-slate-700">
                        <label class="flex items-center cursor-pointer text-slate-600 dark:text-slate-300 px-1">
                            <input type="checkbox" id="poem-dropcap-check" onchange="updateCurrentPoemStyle()" class="mr-1 rounded text-amber-700 focus:ring-amber-500">
                            <span>Capitular</span>
                        </label>
                    </div>

                    <!-- Page Break After Poem toggle -->
                    <div class="flex items-center space-x-1 bg-white dark:bg-slate-800 p-1 rounded border border-slate-200 dark:border-slate-700">
                        <label class="flex items-center cursor-pointer text-slate-600 dark:text-slate-300 px-1" title="Forçar página seguinte após este poema">
                            <input type="checkbox" id="poem-pagebreak-check" onchange="updateCurrentPoemStyle()" class="mr-1 rounded text-amber-700 focus:ring-amber-500">
                            <span>Quebrar Página</span>
                        </label>
                    </div>

                    <div class="ml-auto flex items-center space-x-2">
                        <button onclick="deleteCurrentPoem()" class="text-red-500 hover:text-red-700 p-1 rounded" title="Excluir Poema Atual">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <!-- Poem Writing Canvas -->
                <div class="flex-1 overflow-y-auto p-6 md:p-10 flex flex-col items-center">
                    <div class="w-full max-w-2xl flex flex-col h-full space-y-4">
                        
                        <!-- Poem Title Input -->
                        <input type="text" id="editor-poem-title" oninput="saveCurrentPoemData()" 
                            class="w-full text-2xl md:text-3xl font-garamond font-bold bg-transparent border-b border-parchment-300 dark:border-slate-700 focus:border-amber-700 dark:focus:border-amber-400 focus:outline-none pb-2 text-amber-950 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600"
                            placeholder="Título do Poema...">

                        <!-- Poem Epigraph/Subtitle optional -->
                        <input type="text" id="editor-poem-epigraph" oninput="saveCurrentPoemData()" 
                            class="w-full text-sm font-garamond italic bg-transparent border-b border-transparent focus:border-parchment-300 dark:focus:border-slate-700 focus:outline-none pb-1 text-slate-600 dark:text-slate-400 placeholder-slate-400 dark:placeholder-slate-600"
                            placeholder="Epígrafe ou dedicatória (opcional)...">

                        <!-- Main Verses Textarea -->
                        <textarea id="editor-poem-content" oninput="saveCurrentPoemData()" 
                            class="flex-1 w-full bg-transparent focus:outline-none resize-none font-garamond text-lg leading-relaxed text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-600"
                            placeholder="Escreva seus versos aqui...&#10;&#10;Dica: Pressione Enter para mudar de verso.&#10;Deixe uma linha em branco para criar uma nova estrofe."></textarea>
                    </div>
                </div>

                <!-- Live Counters Footer -->
                <div class="no-print px-4 py-2 bg-parchment-100 dark:bg-slate-850 border-t border-parchment-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 flex justify-between">
                    <div class="space-x-4">
                        <span id="stat-words">0 palavras</span>
                        <span id="stat-lines">0 versos</span>
                        <span id="stat-stanzas">0 estrofes</span>
                        <span id="stat-chars">0 caracteres</span>
                    </div>
                    <span class="text-amber-700 dark:text-amber-400 italic">Salvamento Automático</span>
                </div>
            </section>

            <!-- PREVIEW PANEL (Book Layout Simulator) -->
            <section id="preview-panel" class="flex-1 flex flex-col h-full bg-slate-200 dark:bg-slate-950 overflow-hidden">
                
                <!-- Diagramming Control Bar -->
                <div class="no-print p-2 border-b border-slate-300 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur flex flex-wrap items-center justify-between gap-2 text-xs z-10">
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-slate-600 dark:text-slate-300"><i class="fa-solid fa-sliders mr-1"></i> Diagramação:</span>
                        
                        <!-- Page Format Size -->
                        <select id="layout-size-select" onchange="updateLayoutSettings()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-700 dark:text-slate-200 focus:outline-none">
                            <option value="page-ratio-trade">Formato 6x9 pol (Brochura)</option>
                            <option value="page-ratio-a5">Formato A5 (14.8 x 21 cm)</option>
                            <option value="page-ratio-mobile">Formato Digital (E-Reader 9:16)</option>
                        </select>

                        <!-- Header / Footer style -->
                        <select id="layout-numbering-select" onchange="updateLayoutSettings()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-700 dark:text-slate-200 focus:outline-none">
                            <option value="arabic">Números Arábicos (1, 2, 3)</option>
                            <option value="roman">Números Romanos (I, II, III)</option>
                            <option value="none">Sem Numeração</option>
                        </select>

                        <!-- Decorative Dividers -->
                        <select id="layout-divider-select" onchange="updateLayoutSettings()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-700 dark:text-slate-200 focus:outline-none">
                            <option value="ornament">Ornamentos Elegantes (❦)</option>
                            <option value="stars">Estrelas (✦ ✦ ✦)</option>
                            <option value="line">Linha Sutil</option>
                            <option value="none">Sem Divisor</option>
                        </select>
                    </div>

                    <!-- Page Navigation Controls -->
                    <div class="flex items-center space-x-2">
                        <button onclick="prevPage()" class="p-1 px-2 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200" title="Página Anterior">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <span id="page-counter-indicator" class="text-slate-600 dark:text-slate-300 font-mono text-xs">Página 1 / 1</span>
                        <button onclick="nextPage()" class="p-1 px-2 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200" title="Próxima Página">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        
                        <!-- Toggle Cover Edit View -->
                        <button onclick="toggleCoverEditorModal()" class="ml-2 px-2.5 py-1 bg-amber-800 text-white rounded hover:bg-amber-900 transition flex items-center">
                            <i class="fa-solid fa-book-bookmark mr-1"></i> Capa
                        </button>
                    </div>
                </div>

                <!-- Page Container Viewport -->
                <div class="flex-1 overflow-y-auto p-4 md:p-8 flex items-center justify-center">
                    
                    <!-- Simulated Digital Book Page -->
                    <div id="book-page-canvas" class="page-ratio-trade w-full max-w-md bg-parchment-50 text-slate-900 shadow-2xl rounded border border-parchment-200 p-8 md:p-12 flex flex-col justify-between transition-all duration-300 relative select-none">
                        
                        <!-- Page Header -->
                        <div id="page-header-display" class="text-center font-garamond text-xs text-slate-400 uppercase tracking-widest border-b border-slate-200/50 pb-2 mb-4">
                            <!-- Book Title / Author header -->
                        </div>

                        <!-- Page Main Poetry Content Area -->
                        <div id="page-content-display" class="flex-1 flex flex-col justify-center my-auto">
                            <!-- Dynamic Content Rendered Here -->
                        </div>

                        <!-- Page Footer & Page Number -->
                        <div id="page-footer-display" class="text-center font-garamond text-xs text-slate-500 pt-4 mt-2">
                            1
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- COVER DESIGNER MODAL -->
    <div id="cover-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row gap-6 max-h-[90vh] overflow-y-auto">
            
            <!-- Cover Settings Controls -->
            <div class="flex-1 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-2">
                    <h3 class="font-cinzel font-bold text-lg text-slate-800 dark:text-slate-100">Design da Capa</h3>
                    <button onclick="toggleCoverEditorModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Autor(a):</label>
                        <input type="text" id="cover-author-input" oninput="updateCoverPreview()" value="Seu Nome de Poeta" class="w-full p-2 rounded border border-slate-300 dark:border-slate-600 bg-transparent text-slate-800 dark:text-slate-100">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Subtítulo / Edição:</label>
                        <input type="text" id="cover-subtitle-input" oninput="updateCoverPreview()" value="Coletânea de Poemas" class="w-full p-2 rounded border border-slate-300 dark:border-slate-600 bg-transparent text-slate-800 dark:text-slate-100">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Cor de Fundo da Capa:</label>
                        <select id="cover-bg-select" onchange="updateCoverPreview()" class="w-full p-2 rounded border border-slate-300 dark:border-slate-600 bg-transparent text-slate-800 dark:text-slate-100">
                            <option value="bg-amber-950 text-amber-100">Nobre Escuro (Âmbar / Dourado)</option>
                            <option value="bg-slate-900 text-slate-100">Noite Estrelada (Slate Blue)</option>
                            <option value="bg-emerald-950 text-emerald-100">Verde Poético</option>
                            <option value="bg-rose-950 text-rose-100">Vinho Poesia</option>
                            <option value="bg-parchment-100 text-amber-950">Pergaminho Clássico</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Moldura Ornamentada:</label>
                        <select id="cover-frame-select" onchange="updateCoverPreview()" class="w-full p-2 rounded border border-slate-300 dark:border-slate-600 bg-transparent text-slate-800 dark:text-slate-100">
                            <option value="gold-border">Borda Dupla Dourada</option>
                            <option value="minimal-frame">Moldura Minimalista</option>
                            <option value="vintage-corners">Cantos Vintage</option>
                            <option value="none">Sem Moldura</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-end">
                    <button onclick="toggleCoverEditorModal()" class="px-4 py-2 bg-amber-800 text-white rounded text-xs hover:bg-amber-900 transition">
                        Concluir Capa
                    </button>
                </div>
            </div>

            <!-- Cover Live Preview Canvas -->
            <div class="w-full md:w-56 shrink-0 flex items-center justify-center">
                <div id="cover-preview-card" class="w-full page-ratio-trade bg-amber-950 text-amber-100 p-6 rounded shadow-xl flex flex-col justify-between text-center relative border-4 border-amber-500/30">
                    <div id="cover-author-preview" class="font-cinzel text-xs uppercase tracking-widest mt-2">
                        Seu Nome
                    </div>
                    <div class="my-auto">
                        <i class="fa-solid fa-feather-pointed text-2xl mb-2 opacity-80"></i>
                        <div id="cover-title-preview" class="font-cinzel font-bold text-lg leading-snug">
                            Meu Livro
                        </div>
                        <div id="cover-subtitle-preview" class="font-garamond italic text-xs mt-1 opacity-80">
                            Coletânea
                        </div>
                    </div>
                    <div class="text-[9px] uppercase tracking-wider opacity-60">
                        Poetria Digital
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Book Data Model
        let bookData = {
            title: "Cânticos e Sombras",
            author: "Seu Nome de Poeta",
            subtitle: "Poemas Reunidos",
            coverBg: "bg-amber-950 text-amber-100",
            coverFrame: "gold-border",
            layoutSize: "page-ratio-trade",
            numberingStyle: "arabic",
            dividerStyle: "ornament",
            poems: [
                {
                    id: "p1",
                    title: "O Silêncio dos Versos",
                    epigraph: "Para as noites de escrita calma.",
                    content: "Na penumbra do quarto, a caneta dança,\nDesenhando no papel o que a alma sente.\nCada palavra é uma tênue esperança,\nUm sussurro do tempo, sereno e quente.\n\nO verso se molda na quietude do ar,\nLivre como a brisa que vem do mar.",
                    font: "font-garamond",
                    align: "text-center",
                    dropCap: true,
                    pageBreak: true
                },
                {
                    id: "p2",
                    title: "Crepúsculo",
                    epigraph: "",
                    content: "O sol se esconde no horizonte em brasa,\nE pinta de ouro a nuvem mais distante.\nA noite chega e estende a sua asa,\nTransformando o silêncio em diamante.\n\nE na poesia o tempo se desfaz,\nOnde o poema encontra a sua paz.",
                    font: "font-garamond",
                    align: "text-left",
                    dropCap: false,
                    pageBreak: true
                }
            ]
        };

        let currentPoemId = "p1";
        let currentPageIndex = 0; // 0 is cover, 1+ are poems
        let currentTab = "editor"; // editor, preview, split

        // Initialize App on DOM Load
        window.onload = function() {
            loadLocalProject();
            setupSortableList();
            renderPoemList();
            loadPoemToEditor(currentPoemId);
            updateBookTitleInput();
            renderBookPage();
            updateStats();
        };

        function saveToLocalStorage() {
            localStorage.setItem('poetria_book_data', JSON.stringify(bookData));
        }

        function loadLocalProject() {
            const saved = localStorage.getItem('poetria_book_data');
            if (saved) {
                try {
                    bookData = JSON.parse(saved);
                    if (bookData.poems && bookData.poems.length > 0) {
                        currentPoemId = bookData.poems[0].id;
                    }
                } catch(e) {
                    console.error("Erro ao carregar projeto salvo:", e);
                }
            }
        }

        function updateBookTitleInput() {
            const titleInput = document.getElementById('book-title-input');
            if (titleInput) {
                titleInput.value = bookData.title || "Meu Livro de Poesias";
            }
            titleInput.onchange = function() {
                bookData.title = this.value;
                saveToLocalStorage();
                renderBookPage();
            };
        }

        function switchTab(tab) {
            currentTab = tab;
            const editorPanel = document.getElementById('editor-panel');
            const previewPanel = document.getElementById('preview-panel');
            const btnEditor = document.getElementById('tab-editor-btn');
            const btnPreview = document.getElementById('tab-preview-btn');
            const btnSplit = document.getElementById('tab-split-btn');

            // Reset active button styling
            [btnEditor, btnPreview, btnSplit].forEach(btn => {
                if (btn) {
                    btn.className = "px-3 py-1.5 rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900";
                }
            });

            if (tab === 'editor') {
                editorPanel.classList.remove('hidden');
                previewPanel.classList.add('hidden');
                btnEditor.className = "px-3 py-1.5 rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-amber-900 dark:text-slate-100 font-semibold";
            } else if (tab === 'preview') {
                editorPanel.classList.add('hidden');
                previewPanel.classList.remove('hidden');
                btnPreview.className = "px-3 py-1.5 rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-amber-900 dark:text-slate-100 font-semibold";
                renderBookPage();
            } else if (tab === 'split') {
                editorPanel.classList.remove('hidden');
                previewPanel.classList.remove('hidden');
                btnSplit.className = "px-3 py-1.5 rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-amber-900 dark:text-slate-100 font-semibold";
                renderBookPage();
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function renderPoemList() {
            const container = document.getElementById('poem-list-container');
            container.innerHTML = '';

            bookData.poems.forEach((poem, index) => {
                const isActive = poem.id === currentPoemId;
                const item = document.createElement('div');
                item.dataset.id = poem.id;
                item.className = `group flex items-center justify-between p-2.5 rounded-lg cursor-pointer text-xs transition ${
                    isActive 
                        ? 'bg-amber-800/10 text-amber-900 dark:bg-amber-700/20 dark:text-amber-200 font-semibold border-l-4 border-amber-800 dark:border-amber-500' 
                        : 'hover:bg-parchment-200/60 dark:hover:bg-slate-700/50 text-slate-700 dark:text-slate-300'
                }`;
                
                item.onclick = () => selectPoem(poem.id);

                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-solid fa-grip-vertical text-slate-300 dark:text-slate-600 group-hover:text-slate-400 drag-handle cursor-grab"></i>
                        <span class="truncate">${index + 1}. ${poem.title || 'Sem título'}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 transition">
                        ${countWords(poem.content)} pal.
                    </span>
                `;
                container.appendChild(item);
            });

            document.getElementById('total-poems-count').innerText = `${bookData.poems.length} poemas`;
        }

        function setupSortableList() {
            const container = document.getElementById('poem-list-container');
            new Sortable(container, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: function (evt) {
                    const movedItem = bookData.poems.splice(evt.oldIndex, 1)[0];
                    bookData.poems.splice(evt.newIndex, 0, movedItem);
                    saveToLocalStorage();
                    renderPoemList();
                    renderBookPage();
                }
            });
        }

        function addNewPoem() {
            const newId = 'p_' + Date.now();
            const newPoem = {
                id: newId,
                title: "Novo Poema",
                epigraph: "",
                content: "Escreva aqui os versos do seu novo poema...",
                font: "font-garamond",
                align: "text-center",
                dropCap: false,
                pageBreak: true
            };
            bookData.poems.push(newPoem);
            currentPoemId = newId;
            saveToLocalStorage();
            renderPoemList();
            loadPoemToEditor(newId);
        }

        function selectPoem(id) {
            currentPoemId = id;
            renderPoemList();
            loadPoemToEditor(id);
        }

        function deleteCurrentPoem() {
            if (bookData.poems.length <= 1) {
                alert("O livro deve possuir pelo menos um poema.");
                return;
            }
            if (confirm("Tem certeza de que deseja excluir este poema?")) {
                bookData.poems = bookData.poems.filter(p => p.id !== currentPoemId);
                currentPoemId = bookData.poems[0].id;
                saveToLocalStorage();
                renderPoemList();
                loadPoemToEditor(currentPoemId);
            }
        }

        function loadPoemToEditor(id) {
            const poem = bookData.poems.find(p => p.id === id);
            if (!poem) return;

            document.getElementById('editor-poem-title').value = poem.title || '';
            document.getElementById('editor-poem-epigraph').value = poem.epigraph || '';
            document.getElementById('editor-poem-content').value = poem.content || '';
            document.getElementById('poem-font-select').value = poem.font || 'font-garamond';
            document.getElementById('poem-dropcap-check').checked = !!poem.dropCap;
            document.getElementById('poem-pagebreak-check').checked = !!poem.pageBreak;

            // Apply align button styling
            setPoemAlign(poem.align || 'text-center', false);
            updateStats();
        }

        function saveCurrentPoemData() {
            const poem = bookData.poems.find(p => p.id === currentPoemId);
            if (!poem) return;

            poem.title = document.getElementById('editor-poem-title').value;
            poem.epigraph = document.getElementById('editor-poem-epigraph').value;
            poem.content = document.getElementById('editor-poem-content').value;

            saveToLocalStorage();
            renderPoemList();
            updateStats();
            renderBookPage();
        }

        function updateCurrentPoemStyle() {
            const poem = bookData.poems.find(p => p.id === currentPoemId);
            if (!poem) return;

            poem.font = document.getElementById('poem-font-select').value;
            poem.dropCap = document.getElementById('poem-dropcap-check').checked;
            poem.pageBreak = document.getElementById('poem-pagebreak-check').checked;

            saveToLocalStorage();
            renderBookPage();
        }

        function setPoemAlign(alignClass, shouldSave = true) {
            const poem = bookData.poems.find(p => p.id === currentPoemId);
            if (poem && shouldSave) {
                poem.align = alignClass;
                saveToLocalStorage();
                renderBookPage();
            }

            // Update UI alignment buttons active state
            ['text-left', 'text-center', 'text-right'].forEach(a => {
                const btn = document.getElementById(`btn-align-${a.replace('text-', '')}`);
                if (btn) {
                    if (a === alignClass) {
                        btn.classList.add('bg-amber-800/10', 'text-amber-800', 'font-bold');
                    } else {
                        btn.classList.remove('bg-amber-800/10', 'text-amber-800', 'font-bold');
                    }
                }
            });
        }

        function countWords(str) {
            if (!str) return 0;
            return str.trim().split(/\s+/).filter(w => w.length > 0).length;
        }

        function updateStats() {
            const poem = bookData.poems.find(p => p.id === currentPoemId);
            if (!poem) return;

            const text = poem.content || '';
            const words = countWords(text);
            const chars = text.length;
            const lines = text ? text.split('\n').filter(l => l.trim().length > 0).length : 0;
            const stanzas = text ? text.split(/\n\s*\n/).filter(s => s.trim().length > 0).length : 0;

            document.getElementById('stat-words').innerText = `${words} palavras`;
            document.getElementById('stat-lines').innerText = `${lines} versos`;
            document.getElementById('stat-stanzas').innerText = `${stanzas} estrofes`;
            document.getElementById('stat-chars').innerText = `${chars} caracteres`;

            // Calculate total words in whole book
            const totalWords = bookData.poems.reduce((sum, p) => sum + countWords(p.content), 0);
            document.getElementById('total-words-count').innerText = `${totalWords} palavras no livro`;
        }

        function updateLayoutSettings() {
            bookData.layoutSize = document.getElementById('layout-size-select').value;
            bookData.numberingStyle = document.getElementById('layout-numbering-select').value;
            bookData.dividerStyle = document.getElementById('layout-divider-select').value;
            saveToLocalStorage();
            renderBookPage();
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderBookPage();
            }
        }

        function nextPage() {
            if (currentPageIndex < bookData.poems.length) {
                currentPageIndex++;
                renderBookPage();
            }
        }

        function getRomanNumeral(num) {
            const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
            let roman = '', i;
            for (i in lookup) {
                while (num >= lookup[i]) {
                    roman += i;
                    num -= lookup[i];
                }
            }
            return roman;
        }

        function renderBookPage() {
            const canvas = document.getElementById('book-page-canvas');
            const headerDisplay = document.getElementById('page-header-display');
            const contentDisplay = document.getElementById('page-content-display');
            const footerDisplay = document.getElementById('page-footer-display');
            const pageCounter = document.getElementById('page-counter-indicator');

            // Apply size aspect ratio
            canvas.className = `${bookData.layoutSize || 'page-ratio-trade'} w-full max-w-md bg-parchment-50 text-slate-900 shadow-2xl rounded border border-parchment-200 p-8 md:p-12 flex flex-col justify-between transition-all duration-300 relative select-none`;

            const totalPages = bookData.poems.length; // Page 0 is Cover
            pageCounter.innerText = currentPageIndex === 0 ? "Capa" : `Página ${currentPageIndex} / ${totalPages}`;

            // COVER PAGE (Index 0)
            if (currentPageIndex === 0) {
                headerDisplay.innerHTML = '';
                footerDisplay.innerHTML = '';
                
                contentDisplay.innerHTML = `
                    <div class="h-full flex flex-col justify-between text-center py-6">
                        <div class="font-cinzel text-xs uppercase tracking-widest text-amber-900/70">
                            ${bookData.author || 'Nome do Autor'}
                        </div>
                        <div class="my-auto space-y-3">
                            <i class="fa-solid fa-feather-pointed text-3xl text-amber-900/60 mb-2"></i>
                            <h2 class="font-cinzel font-bold text-2xl md:text-3xl text-amber-950 leading-tight">
                                ${bookData.title || 'Título do Livro'}
                            </h2>
                            ${bookData.subtitle ? `<p class="font-garamond italic text-sm text-slate-600">${bookData.subtitle}</p>` : ''}
                        </div>
                        <div class="font-garamond text-[10px] text-slate-400 uppercase tracking-widest">
                            Edição do Autor
                        </div>
                    </div>
                `;
                return;
            }

            // POEM PAGE (Index 1+)
            const poem = bookData.poems[currentPageIndex - 1];
            if (!poem) return;

            // Header
            headerDisplay.innerText = bookData.title || 'Poetria';

            // Divider HTML based on settings
            let dividerHTML = '';
            if (bookData.dividerStyle === 'ornament') {
                dividerHTML = `<div class="text-center text-amber-900/40 text-sm my-3 font-garamond">❦</div>`;
            } else if (bookData.dividerStyle === 'stars') {
                dividerHTML = `<div class="text-center text-amber-900/40 text-xs my-3 tracking-widest">✦ ✦ ✦</div>`;
            } else if (bookData.dividerStyle === 'line') {
                dividerHTML = `<div class="w-12 h-px bg-slate-300 mx-auto my-3"></div>`;
            }

            // Stanzas processing
            const stanzas = (poem.content || '').split(/\n\s*\n/);
            let formattedPoemHTML = stanzas.map((stanza, sIdx) => {
                const lines = stanza.split('\n');
                let stanzaHTML = lines.map((line, lIdx) => {
                    // Apply Drop Cap if enabled on first line of first stanza
                    if (sIdx === 0 && lIdx === 0 && poem.dropCap && line.length > 0) {
                        return `<span class="drop-cap">${line}</span>`;
                    }
                    return `<div>${line || '&nbsp;'}</div>`;
                }).join('');

                return `<div class="stanza mb-4">${stanzaHTML}</div>`;
            }).join(dividerHTML);

            contentDisplay.innerHTML = `
                <div class="${poem.font || 'font-garamond'} ${poem.align || 'text-center'}">
                    <h3 class="text-xl md:text-2xl font-bold font-garamond text-amber-950 mb-1">
                        ${poem.title || ''}
                    </h3>
                    ${poem.epigraph ? `<p class="text-xs italic text-slate-500 mb-6 font-garamond">${poem.epigraph}</p>` : '<div class="mb-4"></div>'}
                    <div class="text-sm md:text-base leading-relaxed text-slate-800">
                        ${formattedPoemHTML}
                    </div>
                </div>
            `;

            // Footer / Page Numbering
            if (bookData.numberingStyle === 'roman') {
                footerDisplay.innerText = getRomanNumeral(currentPageIndex);
            } else if (bookData.numberingStyle === 'arabic') {
                footerDisplay.innerText = currentPageIndex;
            } else {
                footerDisplay.innerText = '';
            }
        }

        function toggleCoverEditorModal() {
            const modal = document.getElementById('cover-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('cover-author-input').value = bookData.author || '';
                document.getElementById('cover-subtitle-input').value = bookData.subtitle || '';
                updateCoverPreview();
            }
        }

        function updateCoverPreview() {
            bookData.author = document.getElementById('cover-author-input').value;
            bookData.subtitle = document.getElementById('cover-subtitle-input').value;
            bookData.coverBg = document.getElementById('cover-bg-select').value;
            bookData.coverFrame = document.getElementById('cover-frame-select').value;

            const previewCard = document.getElementById('cover-preview-card');
            const titlePrev = document.getElementById('cover-title-preview');
            const authorPrev = document.getElementById('cover-author-preview');
            const subtitlePrev = document.getElementById('cover-subtitle-preview');

            previewCard.className = `w-full page-ratio-trade ${bookData.coverBg} p-6 rounded shadow-xl flex flex-col justify-between text-center relative border-4 border-amber-500/30`;
            titlePrev.innerText = bookData.title || "Meu Livro";
            authorPrev.innerText = bookData.author || "Autor(a)";
            subtitlePrev.innerText = bookData.subtitle || "";

            saveToLocalStorage();
            renderBookPage();
        }

        function exportToPrint() {
            window.print();
        }

        function exportProjectJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${(bookData.title || 'livro_poesia').toLowerCase().replace(/\s+/g, '_')}_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importProjectJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.poems) {
                        bookData = imported;
                        saveToLocalStorage();
                        renderPoemList();
                        if (bookData.poems.length > 0) {
                            currentPoemId = bookData.poems[0].id;
                            loadPoemToEditor(currentPoemId);
                        }
                        updateBookTitleInput();
                        renderBookPage();
                        alert("Projeto importado com sucesso!");
                    }
                } catch(err) {
                    alert("Erro ao ler arquivo JSON de projeto.");
                }
            };
            reader.readAsText(file);
        }

        function exportTextEPUB() {
            let output = `${bookData.title}\nAutor: ${bookData.author}\n${bookData.subtitle ? bookData.subtitle + '\n' : ''}\n` + "=".repeat(40) + "\n\n";
            
            bookData.poems.forEach((p, idx) => {
                output += `[Poema ${idx + 1}] ${p.title}\n`;
                if (p.epigraph) output += `Epígrafe: ${p.epigraph}\n`;
                output += `\n${p.content}\n\n`;
                output += "-".repeat(20) + "\n\n";
            });

            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${(bookData.title || 'livro').toLowerCase().replace(/\s+/g, '_')}_texto_formatado.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
